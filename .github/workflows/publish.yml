name: Publish Agent Fitness Bench
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH @emilia-protocol/agent-fitness-bench@0.1.0
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: npm-publish-agent-fitness-bench
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == 'FutureEnterprises'
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.pack.outputs.version }}
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Validate explicit release identity
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.name !== '@emilia-protocol/agent-fitness-bench'
              || !/^\d+\.\d+\.\d+$/.test(p.version)
              || process.env.CONFIRMATION !== `PUBLISH ${p.name}@${p.version}`) {
            throw Error('release identity or confirmation mismatch');
          }
          JS
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm test && npm run build
      - run: npm audit --audit-level=high
      - name: Pack twice and verify exact bytes
        id: pack
        run: |
          mkdir pack-a pack-b
          npm pack --ignore-scripts --pack-destination pack-a --json > pack-a.json
          npm pack --ignore-scripts --pack-destination pack-b --json > pack-b.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const a = JSON.parse(fs.readFileSync('pack-a.json'))[0];
          const b = JSON.parse(fs.readFileSync('pack-b.json'))[0];
          if (a.name !== '@emilia-protocol/agent-fitness-bench'
              || a.filename !== b.filename || !/^[a-z0-9.-]+\.tgz$/.test(a.filename)) throw Error('pack identity');
          const bytes = fs.readFileSync(`pack-a/${a.filename}`);
          if (!bytes.equals(fs.readFileSync(`pack-b/${b.filename}`))) throw Error('non-reproducible package');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `sha256=${crypto.createHash('sha256').update(bytes).digest('hex')}\nfilename=${a.filename}\nversion=${a.version}\n`);
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: upload
        with:
          name: npm-exact-package
          path: pack-a/*.tgz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: registry-publishing-approval
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: package-input
      - name: Verify approved artifact and current main
        env:
          GH_TOKEN: ${{ github.token }}
          FILENAME: ${{ needs.build.outputs.filename }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
          test "$(find package-input -type f | wc -l)" -eq 1
          echo "$SHA256  package-input/$FILENAME" | sha256sum -c -
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: package-input/${{ needs.build.outputs.filename }}
      - name: Publish approved bytes
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
        run: npm publish "./package-input/$FILENAME" --access public --provenance --ignore-scripts
      - name: Verify registry integrity
        env:
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const response = await fetch(`https://registry.npmjs.org/@emilia-protocol%2fagent-fitness-bench/${process.env.VERSION}`);
          if (!response.ok) throw Error(`registry HTTP ${response.status}`);
          const metadata = await response.json();
          const artifact = await fetch(metadata.dist.tarball);
          if (!artifact.ok) throw Error(`tarball HTTP ${artifact.status}`);
          const hash = crypto.createHash('sha256').update(Buffer.from(await artifact.arrayBuffer())).digest('hex');
          if (hash !== process.env.EXPECTED_SHA256) throw Error('registry artifact mismatch');
          JS
